[project]
name = "tahoe-public-plugins"
version = "0.3.4"
description = "Validation, residue scanning and packaging tooling for the Tahoe Bio plugin marketplace."
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "jsonschema>=4.20",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
