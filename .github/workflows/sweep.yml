name: Branch leak sweep

# The other half of the per-branch scan. CI (ci.yml) judges one commit on its
# own history; this sweep reports the same scan once for every remote branch, so
# a dirty branch is visible and names the commit and pusher — without failing
# unrelated work. It never fails on a dirty branch; it reports and exits 0.
#
# Pre-publication gate: run this and confirm every branch is clean.
on:
  workflow_dispatch:
  schedule:
    # Weekly, Monday 06:17 UTC (off the hour so it does not pile onto :00 runs).
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 0
          # The origin is private until publication, so the fetch below needs the
          # checkout token. Keep it for this read-only job; the job's permissions
          # are contents:read, so the token can only read.
          persist-credentials: true

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Fetch every branch
        # Fails the job on any fetch error rather than sweeping a partial set.
        run: git fetch --prune origin "+refs/heads/*:refs/remotes/origin/*"

      - name: Sweep every branch's history
        run: uv run python scripts/sweep_branches.py
