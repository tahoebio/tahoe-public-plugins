name: CI

# Branch gate for the staging model (ML-520 w02): PRs into `staging` or `main`,
# and pushes to either branch, run this workflow. `staging` is where work lands
# first; `main` advances only by promotion.
on:
  push:
    branches: [main, staging]
    # A tag can point at a commit outside every branch tip's ancestry, so a tag
    # push must run the scan too: it checks the tag's own ancestry.
    tags: ["**"]
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          # Full history of the ref under test: validate.py scans this commit's
          # own history. Other branches are fetched too, but the scan ignores
          # them, so one stale branch cannot fail an unrelated one (the
          # workflow_dispatch sweep reports those separately).
          fetch-depth: 0
          # Fetch tag objects too: on a tag push the annotated tag's own message
          # is part of the scanned surface, and a tag object is not a commit.
          fetch-tags: true
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Validate repository
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        # On a tag push, HEAD is the tag's TARGET commit, so name the tag ref: the
        # scan then reads the pushed tag object's own message and chain.
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            uv run python scripts/validate.py --ref "refs/tags/$REF_NAME"
          else
            uv run python scripts/validate.py
          fi

      - name: Run offline tests
        run: uv run pytest

      - name: Build release archive
        run: uv run python scripts/package.py --out dist
